[project]
name = "lbp"
version = "1.0.0"
description = "PennyMac Loan Boarding Platform: mapping, rules-as-code, exception management, analytics"
requires-python = ">=3.11"
# What the Glue data plane needs when the wheel is installed with --additional-python-modules
# (Glue 5.0 already ships pandas, pyarrow, boto3). The API image pins exact versions via requirements.txt.
dependencies = [
  "SQLAlchemy>=2.0.36",
  "openpyxl>=3.1",
  "paramiko>=3.4",
  "cryptography>=42",
  "PyJWT>=2.8",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lbp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = ["E501", "S101", "S311", "B008", "S608", "B904", "S110", "S112", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S", "E402"]
"migrations/*" = ["I", "UP"]
