# Local full stack: API + web app on http://localhost:8000, worker for queued batches.
services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    environment:
      LBP_DATA_DIR: /data
      LBP_AI_PROVIDER: ${LBP_AI_PROVIDER:-heuristic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: ["lbp-data:/data"]
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "lbp.worker"]
    environment:
      LBP_DATA_DIR: /data
    volumes: ["lbp-data:/data"]
volumes:
  lbp-data: {}
